# DeFi News Bot Configuration
# Environment variables can be referenced using ${VAR_NAME} syntax
# Values in .env file will override these settings

app:
  name: "DeFi News Bot"
  environment: "development"
  logLevel: "info"

telegram:
  botToken: "${TELEGRAM_BOT_TOKEN}"
  allowedChatIds:
    - "${TELEGRAM_CHAT_ID}"
  adminChatIds:
    - "${TELEGRAM_ADMIN_ID}"
  pollingMode: true

collectors:
  defillama:
    enabled: true
    baseUrl: "https://api.llama.fi"
    pollingIntervalMs: 300000  # 5 minutes
    endpoints:
      protocols: true
      chains: true
      tvl: true
    # Top 50 protocols by TVL - only track these for quality alerts
    watchlist:
      - "lido"
      - "aave"
      - "eigenlayer"
      - "maker"
      - "uniswap"
      - "ethena"
      - "jito"
      - "rocket-pool"
      - "compound"
      - "pendle"
      - "morpho"
      - "spark"
      - "instadapp"
      - "summer.fi"
      - "curve-dex"
      - "convex-finance"
      - "renzo"
      - "ether.fi"
      - "puffer-finance"
      - "kelp-dao"
      - "gmx"
      - "hyperliquid"
      - "dydx"
      - "raydium"
      - "kamino"
      - "drift"
      - "marinade"
      - "sanctum"
      - "jupiter"
      - "orca"
      - "aerodrome"
      - "velodrome"
      - "camelot"
      - "trader-joe"
      - "balancer"
      - "stargate"
      - "layerzero"
      - "wormhole"
      - "across"
      - "synapse"
      - "beefy"
      - "yearn-finance"
      - "gearbox"
      - "frax"
      - "liquity"
      - "blast"
      - "scroll"
      - "linea"
      - "base"
      - "arbitrum"

  twitter:
    enabled: true
    rapidApiKey: "${RAPIDAPI_KEY}"
    pollingIntervalMs: 180000  # 3 minutes
    # FOCUSED: Security accounts only for high-value alerts
    priorityAccounts:
      # Security Researchers (HIGH PRIORITY)
      - "PeckShieldAlert"
      - "BlockSecTeam"
      - "certikiAlert"
      - "SlowMist_Team"
      - "samczsun"
      - "zachxbt"

      # Official Protocol Accounts (for confirmed announcements)
      - "eigenlayer"
      - "LidoFinance"
      - "AaveAave"
      - "Uniswap"
      - "MakerDAO"

  coingecko:
    enabled: true
    baseUrl: "https://api.coingecko.com/api/v3"
    apiKey: "${COINGECKO_API_KEY}"
    pollingIntervalMs: 180000  # 3 minutes
    watchlistIds:
      # Stablecoins (CRITICAL - for de-peg monitoring)
      - "tether"
      - "usd-coin"
      - "dai"
      - "frax"
      - "ethena-usde"
      - "first-digital-usd"

      # Major tokens (for large price moves only)
      - "ethereum"
      - "bitcoin"
      - "solana"

alerts:
  globalCooldownMs: 300000  # 5 minutes between alerts
  deduplicationWindowMs: 86400000  # 24 hours

  categories:
    # CRITICAL: Stablecoin de-peg alerts
    STABLECOIN_DEPEG:
      enabled: true
      priority: 4  # CRITICAL
      cooldownMs: 0  # No cooldown
      thresholds:
        maxDeviationPercent: 0.5  # Alert if > 0.5% from $1.00

    # CRITICAL: Security incidents
    SECURITY:
      enabled: true
      priority: 4  # CRITICAL
      cooldownMs: 0  # No cooldown
      thresholds:
        minLossValueUsd: 50000  # Alert on $50K+ exploits

    # HIGH: Large TVL changes on top protocols
    TVL_CHANGE:
      enabled: true
      priority: 3  # HIGH
      cooldownMs: 1800000  # 30 minutes
      thresholds:
        minChangePercent: 20  # Only 20%+ changes
        minTvlUsd: 10000000  # Only $10M+ protocols
        timeframeHours: 24

    # HIGH: Confirmed airdrops from official accounts
    INCENTIVE:
      enabled: true
      priority: 3  # HIGH
      cooldownMs: 600000  # 10 minutes
      thresholds:
        requireOfficialAccount: true  # Only from verified protocol accounts

    # MEDIUM: Token unlocks
    TOKEN_EVENT:
      enabled: true
      priority: 2  # MEDIUM
      cooldownMs: 3600000  # 1 hour
      thresholds:
        minUnlockValueUsd: 10000000  # Only $10M+ unlocks
        daysBeforeUnlock: 3  # Only 3 days before

    # LOW: Governance (disabled for now - too noisy)
    GOVERNANCE:
      enabled: false
      priority: 1  # LOW
      cooldownMs: 3600000
      thresholds: {}

    # LOW: Narrative/trends (disabled for now - too generic)
    NARRATIVE:
      enabled: false
      priority: 1  # LOW
      cooldownMs: 3600000
      thresholds:
        minMentions: 10

storage:
  databasePath: "./data/defi_bot.db"
  backupEnabled: true
  backupIntervalHours: 24
  maxAlertHistoryDays: 30

rateLimit:
  defillama:
    requestsPerMinute: 20
    burstLimit: 5

  twitter:
    requestsPerMinute: 15
    monthlyTweetCap: 400000

  coingecko:
    requestsPerMinute: 10
    monthlyCallLimit: 8000
