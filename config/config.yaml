# DeFi News Bot Configuration
# Environment variables can be referenced using ${VAR_NAME} syntax
# Values in .env file will override these settings

app:
  name: "DeFi News Bot"
  environment: "development"
  logLevel: "info"

telegram:
  botToken: "${TELEGRAM_BOT_TOKEN}"
  allowedChatIds:
    - "${TELEGRAM_CHAT_ID}"
  adminChatIds:
    - "${TELEGRAM_ADMIN_ID}"
  pollingMode: true

collectors:
  defillama:
    enabled: true
    baseUrl: "https://api.llama.fi"
    pollingIntervalMs: 300000  # 5 minutes
    endpoints:
      protocols: true
      chains: true
      tvl: true
    # Top 50 protocols by TVL - only track these for quality alerts
    watchlist:
      - "lido"
      - "aave"
      - "eigenlayer"
      - "maker"
      - "uniswap"
      - "ethena"
      - "jito"
      - "rocket-pool"
      - "compound"
      - "pendle"
      - "morpho"
      - "spark"
      - "instadapp"
      - "summer.fi"
      - "curve-dex"
      - "convex-finance"
      - "renzo"
      - "ether.fi"
      - "puffer-finance"
      - "kelp-dao"
      - "gmx"
      - "hyperliquid"
      - "dydx"
      - "raydium"
      - "kamino"
      - "drift"
      - "marinade"
      - "sanctum"
      - "jupiter"
      - "orca"
      - "aerodrome"
      - "velodrome"
      - "camelot"
      - "trader-joe"
      - "balancer"
      - "stargate"
      - "layerzero"
      - "wormhole"
      - "across"
      - "synapse"
      - "beefy"
      - "yearn-finance"
      - "gearbox"
      - "frax"
      - "liquity"
      - "blast"
      - "scroll"
      - "linea"
      - "base"
      - "arbitrum"

  twitter:
    enabled: true
    rapidApiKey: "${RAPIDAPI_KEY}"
    pollingIntervalMs: 180000  # 3 minutes
    priorityAccounts:
      # Security Researchers (CRITICAL)
      - "PeckShieldAlert"
      - "BlockSecTeam"
      - "certikiAlert"
      - "SlowMist_Team"
      - "samczsun"
      - "zachxbt"

      # DeFi Analysts (HIGH VALUE)
      - "DefiIgnas"
      - "Defi_Made_Here"
      - "Route2FI"

      # Official Protocol Accounts
      - "eigenlayer"
      - "LidoFinance"
      - "AaveAave"
      - "Uniswap"
      - "MakerDAO"
      - "CurveFinance"

      # News & Research
      - "DefiLlama"
      - "MessariCrypto"
      - "TheBlock__"
      - "DuneAnalytics"

  coingecko:
    enabled: true
    baseUrl: "https://api.coingecko.com/api/v3"
    apiKey: "${COINGECKO_API_KEY}"
    pollingIntervalMs: 180000  # 3 minutes
    watchlistIds:
      # Stablecoins (CRITICAL - for de-peg monitoring)
      - "tether"
      - "usd-coin"
      - "dai"
      - "frax"
      - "ethena-usde"
      - "first-digital-usd"

      # Major tokens (for large price moves only)
      - "ethereum"
      - "bitcoin"
      - "solana"

  # Phase 2 Collectors
  cryptopanic:
    enabled: false  # Enable when API key is configured
    apiKey: "${CRYPTOPANIC_API_KEY}"
    baseUrl: "https://cryptopanic.com/api/v1"
    pollingIntervalMs: 180000  # 3 minutes (free tier: 5 calls/min)
    currencies:
      - "ETH"
      - "BTC"
      - "SOL"
      - "ARB"
      - "OP"
    filter: "important"

  snapshot:
    enabled: false
    graphqlUrl: "https://hub.snapshot.org/graphql"
    pollingIntervalMs: 600000  # 10 minutes
    watchedSpaces:
      - "aave.eth"
      - "uniswap"
      - "ens.eth"
      - "lido-snapshot.eth"
      - "safe.eth"
      - "arbitrumfoundation.eth"

  tokenUnlocks:
    enabled: false
    apiKey: "${TOKEN_UNLOCKS_API_KEY}"
    baseUrl: "https://token.unlocks.app/api"
    pollingIntervalMs: 3600000  # 1 hour
    minUnlockValueUsd: 10000000  # $10M+ unlocks
    daysAhead: 7

  l2beat:
    enabled: false
    baseUrl: "https://l2beat.com/api"
    pollingIntervalMs: 600000  # 10 minutes
    minTvlUsd: 100000000  # $100M+ L2s
    minChangePercent: 10  # 10%+ changes

alerts:
  globalCooldownMs: 300000  # 5 minutes between alerts
  deduplicationWindowMs: 86400000  # 24 hours

  categories:
    # CRITICAL: Stablecoin de-peg alerts
    STABLECOIN_DEPEG:
      enabled: true
      priority: 4  # CRITICAL
      cooldownMs: 0  # No cooldown
      thresholds:
        maxDeviationPercent: 0.5  # Alert if > 0.5% from $1.00

    # CRITICAL: Security incidents
    SECURITY:
      enabled: true
      priority: 4  # CRITICAL
      cooldownMs: 0  # No cooldown
      thresholds:
        minLossValueUsd: 50000  # Alert on $50K+ exploits

    # HIGH: Large TVL changes on top protocols
    TVL_CHANGE:
      enabled: true
      priority: 3  # HIGH
      cooldownMs: 1800000  # 30 minutes
      thresholds:
        minChangePercent: 20  # Only 20%+ changes
        minTvlUsd: 10000000  # Only $10M+ protocols
        timeframeHours: 24

    # HIGH: Confirmed airdrops from official accounts
    INCENTIVE:
      enabled: true
      priority: 3  # HIGH
      cooldownMs: 600000  # 10 minutes
      thresholds: {}  # Filtered via Twitter accounts list (security + official only)

    # MEDIUM: Token unlocks
    TOKEN_EVENT:
      enabled: true
      priority: 2  # MEDIUM
      cooldownMs: 3600000  # 1 hour
      thresholds:
        minUnlockValueUsd: 10000000  # Only $10M+ unlocks
        daysBeforeUnlock: 3  # Only 3 days before

    # LOW: Governance (disabled for now - too noisy)
    GOVERNANCE:
      enabled: false
      priority: 1  # LOW
      cooldownMs: 3600000
      thresholds: {}

    # LOW: Narrative/trends (disabled for now - too generic)
    NARRATIVE:
      enabled: false
      priority: 1  # LOW
      cooldownMs: 3600000
      thresholds:
        minMentions: 10

    # Phase 2 Categories
    # HIGH: Liquidations ($100K+)
    LIQUIDATION:
      enabled: true
      priority: 3  # HIGH
      cooldownMs: 300000
      thresholds:
        minValueUsd: 100000

    # MEDIUM: Gas spikes
    GAS_PRICE:
      enabled: true
      priority: 2  # MEDIUM
      cooldownMs: 1800000  # 30 minutes
      thresholds:
        minGwei: 50
        minPercentIncrease: 100

    # MEDIUM: DEX volume surges
    DEX_VOLUME:
      enabled: true
      priority: 2  # MEDIUM
      cooldownMs: 3600000  # 1 hour
      thresholds:
        minPercentIncrease: 200

rateLimit:
  defillama:
    requestsPerMinute: 20
    burstLimit: 5

  twitter:
    requestsPerMinute: 15
    monthlyTweetCap: 400000

  coingecko:
    requestsPerMinute: 10
    monthlyCallLimit: 8000

  # Phase 2 rate limits
  cryptopanic:
    requestsPerMinute: 5  # Free tier: 5 calls/min
    burstLimit: 1

  snapshot:
    requestsPerMinute: 30
    burstLimit: 5

  tokenUnlocks:
    requestsPerMinute: 10
    burstLimit: 2

  l2beat:
    requestsPerMinute: 10
    burstLimit: 2
