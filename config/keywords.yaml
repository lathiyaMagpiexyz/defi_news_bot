# DeFi Keywords Configuration
# Focused keywords for high-value alerts only

categories:
  # CRITICAL: Security incidents - VERY SPECIFIC keywords
  SECURITY:
    primary:
      - "exploit"
      - "hacked"
      - "drained"
      - "stolen"
      - "emergency"
      - "paused"
      - "rug pull"
      - "flash loan attack"
      - "oracle manipulation"
      - "funds at risk"
      - "private key compromised"
      - "bridge hack"
      - "infinite mint"
    secondary:
      - "investigating"
      - "suspicious"
      - "abnormal"
    negative:
      - "test"
      - "simulation"
      - "fake"

  # CRITICAL: Stablecoin de-peg keywords
  STABLECOIN_DEPEG:
    primary:
      - "depeg"
      - "de-peg"
      - "lost peg"
      - "below peg"
      - "above peg"
      - "USDC depeg"
      - "USDT depeg"
      - "DAI depeg"
    secondary:
      - "redemption"
      - "bank run"
      - "liquidity crisis"
    negative: []

  # HIGH: Confirmed airdrop announcements only
  INCENTIVE:
    primary:
      - "airdrop confirmed"
      - "token launch"
      - "TGE announced"
      - "snapshot taken"
      - "claiming live"
      - "eligibility checker"
    secondary:
      - "official announcement"
      - "season ends"
    negative:
      - "scam"
      - "fake"
      - "giveaway"
      - "retweet"
      - "follow to win"
      - "send ETH"

  # HIGH: Large TVL movements
  TVL_CHANGE:
    primary:
      - "TVL surge"
      - "massive inflow"
      - "capital flight"
      - "TVL ATH"
      - "billion TVL"
    secondary:
      - "liquidity"
      - "deposits"
    negative:
      - "prediction"
      - "might"
      - "speculation"

  # MEDIUM: Token unlocks
  TOKEN_EVENT:
    primary:
      - "token unlock"
      - "cliff unlock"
      - "VC unlock"
      - "team tokens"
      - "vesting"
    secondary:
      - "emissions"
      - "supply increase"
    negative:
      - "speculation"
      - "might unlock"

  # Phase 2 Categories

  # HIGH: Liquidations
  LIQUIDATION:
    primary:
      - "liquidation"
      - "liquidated"
      - "position liquidated"
      - "mass liquidation"
      - "liquidation cascade"
    secondary:
      - "margin call"
      - "underwater"
      - "health factor"
    negative:
      - "near liquidation"
      - "risk of"

  # MEDIUM: Gas prices
  GAS_PRICE:
    primary:
      - "gas spike"
      - "high gas"
      - "gas fees"
      - "gas war"
      - "gwei"
    secondary:
      - "congestion"
      - "network busy"
      - "priority fee"
    negative: []

  # MEDIUM: DEX volume
  DEX_VOLUME:
    primary:
      - "volume surge"
      - "trading volume"
      - "record volume"
      - "volume ATH"
    secondary:
      - "DEX"
      - "swap"
      - "trading activity"
    negative:
      - "wash trading"

  # LOW: Governance proposals
  GOVERNANCE:
    primary:
      - "proposal"
      - "governance vote"
      - "voting live"
      - "DAO vote"
    secondary:
      - "quorum"
      - "snapshot"
    negative:
      - "opinion"
      - "should vote"

  # LOW: Narrative/trends
  NARRATIVE:
    primary:
      - "narrative shift"
      - "trending"
      - "new meta"
    secondary:
      - "trend"
      - "sector"
    negative:
      - "might be"
      - "speculation"
